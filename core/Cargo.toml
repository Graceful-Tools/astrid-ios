# The Apple apps' bindings to astrid-core.
#
# astrid-core is the shared client core (https://github.com/Graceful-Tools/astrid-core). Its rule 8
# puts each platform's binding layer in that platform's repository, as astrid-windows keeps its C
# ABI beside its shell. This is the Apple one: UniFFI, whose Swift generator is first-party.
#
# The core is pinned by revision and bumped deliberately — the same discipline as the contract
# fixtures. Building against a local checkout instead is `scripts/core/build-xcframework.sh
# --core ../astrid-core`, which patches the dependency for that build only.
[workspace]
resolver = "2"
members = ["astrid-apple", "bindgen"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
publish = false

[workspace.dependencies]
# `version` beside the rev is for cargo-deny, not cargo: 0.20.2 reads a git requirement with no
# version as a wildcard and fails `bans` on it (AITD-507). It is also a real check — a core whose
# crate version leaves 0.1 stops resolving here, which is the signal a breaking bump should give.
# The scripts in scripts/core/ read the rev from this line; keep `git` and `rev` first.
astrid-core = { git = "https://github.com/Graceful-Tools/astrid-core.git", rev = "084c2c005e7aa673f3fba69147ca48081fad8e9e", version = "0.1" }
uniffi = "0.32"

# Measured for AITD-625 on the ios-arm64 slice: a dead-stripped link of the staticlib went from
# 15.2 MB (thin LTO, opt-level 3) to 7.8 MB (fat LTO, opt-level "s"); "z" saved another 1.5 MB but
# turns off loop vectorisation, which the rules and markdown paths use.
# None of this applies unless the staticlib is built ALONE: with `crate-type = ["staticlib", "lib"]`
# rustc skips LTO entirely and keeps every crate's embedded bitcode (65 MB of the old 96 MB file).
# scripts/core/build-xcframework.sh builds it with `cargo rustc --crate-type staticlib` for that.
# `strip` is absent on purpose: rustc only strips what it links, and a staticlib is not linked —
# the app's own archive step strips the final binary and keeps the dSYM.
[profile.release]
lto = "fat"
opt-level = "s"
codegen-units = 1
panic = "unwind"
