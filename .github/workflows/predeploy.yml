name: 'Predeploy Checks'

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Check mode'
        required: false
        default: 'full'
        type: choice
        options:
          - full
          - standard
          - quick

jobs:
  predeploy:
    name: 'Run Predeploy Checks'
    runs-on: [self-hosted, astrid-ios]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Astrid UI test helper
        uses: actions/checkout@v4
        with:
          repository: Graceful-Tools/astrid-web
          ref: 5f0f20ccfc4b2accf738238ac5473316c90b421e
          path: astrid-web
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            astrid-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Astrid UI test helper dependencies
        if: ${{ inputs.mode == 'full' }}
        working-directory: astrid-web
        run: npm ci

      - name: Ensure Xcode tools on PATH
        run: |
          # Runner shells are non-login and don't inherit /usr/bin/xcodebuild
          # via xcode-select. Resolve it explicitly.
          XCODE_PATH=$(xcode-select -p 2>/dev/null || echo "/Applications/Xcode.app/Contents/Developer")
          echo "${XCODE_PATH}/usr/bin" >> "${GITHUB_PATH}"
          echo "DEVELOPER_DIR=${XCODE_PATH}" >> "${GITHUB_ENV}"

      - name: Run predeploy (standard — unit tests, no UI tests)
        if: ${{ inputs.mode == 'standard' }}
        run: npm run predeploy

      - name: Run predeploy (quick — localizations + brand + build)
        if: ${{ inputs.mode == 'quick' }}
        run: npm run predeploy:quick

      - name: Run predeploy (full — through unit tests)
        if: ${{ inputs.mode == 'full' }}
        run: npm run predeploy

      - name: Run UI tests (full)
        if: ${{ inputs.mode == 'full' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        run: |
          set -euo pipefail
          cookie="$(cd astrid-web && npx tsx scripts/uitest-account.ts --cookie)"
          if [ -z "${cookie}" ]; then
            echo "::error::UI test cookie mint returned empty output"
            exit 1
          fi
          echo "::add-mask::${cookie}"
          ASTRID_UITEST_COOKIE="${cookie}" npm run test:ui
          unset cookie

      - name: Run Mac tests (full)
        if: ${{ inputs.mode == 'full' }}
        run: npm run test:mac
        timeout-minutes: 30

      - name: Summary
        if: always()
        run: |
          echo "Mode: ${{ inputs.mode }}"
          echo "Status: ${{ job.status }}"
