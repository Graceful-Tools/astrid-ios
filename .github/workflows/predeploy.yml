name: 'Predeploy Checks'

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Check mode'
        required: false
        default: 'standard'
        type: choice
        options:
          - standard
          - quick
          - full
          - simple

jobs:
  predeploy:
    name: 'Run Predeploy Checks'
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure Xcode tools on PATH
        run: |
          # Runner shells are non-login and don't inherit /usr/bin/xcodebuild
          # via xcode-select. Resolve it explicitly.
          XCODE_PATH=$(xcode-select -p 2>/dev/null || echo "/Applications/Xcode.app/Contents/Developer")
          echo "${XCODE_PATH}/usr/bin" >> "${GITHUB_PATH}"
          echo "DEVELOPER_DIR=${XCODE_PATH}" >> "${GITHUB_ENV}"

      - name: Run predeploy (standard)
        if: ${{ inputs.mode == 'standard' }}
        run: npm run predeploy

      - name: Run predeploy (quick — TS + lint + build)
        if: ${{ inputs.mode == 'quick' }}
        run: npm run predeploy:quick

      - name: Run predeploy (full)
        if: ${{ inputs.mode == 'full' }}
        run: npm run predeploy:full

      - name: Run predeploy (simple — no auto-fix)
        if: ${{ inputs.mode == 'simple' }}
        run: npm run predeploy:simple

      - name: Summary
        if: always()
        run: |
          echo "Mode: ${{ inputs.mode }}"
          echo "Status: ${{ job.status }}"
