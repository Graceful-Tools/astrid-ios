name: 'Fix All Ready Tasks (iOS)'

# Concurrency: skip new run if one is already in progress for this harness.
concurrency:
  group: fixall-ios-${{ github.event.inputs.harness || 'github-copilot' }}
  cancel-in-progress: false

on:
  workflow_dispatch:
    inputs:
      harness:
        description: 'Agent identity to claim (must match ASTRID_MCP_TOKEN)'
        required: false
        default: 'github-copilot'
        type: choice
        options:
          - github-copilot
          - claude-code
          - codex
          - astrid-server
      dry_run:
        description: 'Dry run — list ready tasks without working them'
        required: false
        default: false
        type: boolean

  schedule:
    # Every 30 minutes, offset 15 min from astrid-web to avoid competing for quota.
    - cron: '15,45 * * * *'

env:
  NODE_VERSION: '20'

jobs:
  list-ready-tasks:
    name: 'List Ready Tasks'
    runs-on: [self-hosted, astrid-ios]
    outputs:
      has_tasks: ${{ steps.list.outputs.has_tasks }}
      task_count: ${{ steps.list.outputs.task_count }}
      task_ids: ${{ steps.list.outputs.task_ids }}
    steps:
      - name: Checkout Astrid task tooling
        uses: actions/checkout@v4
        with:
          repository: Graceful-Tools/astrid-web
          # Temporary pin for the structured queue contract in astrid-web PR #251.
          # Return to main (or its merge commit) after that PR lands, before merging this PR.
          ref: defc3599a3063db67e10d7d4dd600dab0ffbf76d
          path: astrid-web
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: astrid-web/package-lock.json

      - name: Install Astrid task-tool dependencies
        working-directory: astrid-web
        run: npm ci

      - name: List ready tasks
        id: list
        working-directory: astrid-web
        env:
          ASTRID_OAUTH_CLIENT_ID: ${{ secrets.ASTRID_OAUTH_CLIENT_ID }}
          ASTRID_OAUTH_CLIENT_SECRET: ${{ secrets.ASTRID_OAUTH_CLIENT_SECRET }}
          # Scheduled runs always use github-copilot so only tasks assigned to
          # copilot@<domain> are claimed. Manual dispatch can override this.
          ASTRID_FIXALL_HARNESS: ${{ inputs.harness || 'github-copilot' }}
          ASTRID_FIXALL_DRY_RUN: ${{ inputs.dry_run || false }}
        run: |
          HARNESS="${ASTRID_FIXALL_HARNESS}"
          echo "Fetching ready iOS tasks for harness: ${HARNESS}"

          DRY_RUN_ARGS=()
          if [ "${ASTRID_FIXALL_DRY_RUN}" = "true" ]; then
            DRY_RUN_ARGS+=(--dry-run)
          fi

          QUEUE_JSON=$(npx tsx scripts/ready-tasks.ts ios --json --harness "${HARNESS}" "${DRY_RUN_ARGS[@]}")

          TASK_IDS=$(
            printf '%s' "${QUEUE_JSON}" |
              npx tsx scripts/parse-ready-tasks-output.ts |
              paste -sd, -
          )
          if [ -n "${TASK_IDS}" ]; then
            TASK_COUNT=$(awk -F, '{ print NF }' <<< "${TASK_IDS}")
          else
            TASK_COUNT=0
          fi

          echo "task_count=${TASK_COUNT}" >> "${GITHUB_OUTPUT}"
          echo "task_ids=${TASK_IDS}" >> "${GITHUB_OUTPUT}"

          if [ "${TASK_COUNT}" -gt 0 ]; then
            echo "has_tasks=true" >> "${GITHUB_OUTPUT}"
          else
            echo "has_tasks=false" >> "${GITHUB_OUTPUT}"
          fi

  dry-run-report:
    name: 'Dry Run — Task Report'
    runs-on: [self-hosted, astrid-ios]
    needs: list-ready-tasks
    if: ${{ inputs.dry_run == true }}
    steps:
      - name: Report
        run: |
          echo "## Ready iOS Tasks (Dry Run)"
          echo "Harness: ${{ inputs.harness || 'github-copilot' }}"
          echo "Tasks found: ${{ needs.list-ready-tasks.outputs.task_count }}"
          echo ""
          echo "Re-run without dry_run to work these tasks."

  work-tasks:
    name: 'Work Ready Tasks'
    runs-on: [self-hosted, astrid-ios]
    needs: list-ready-tasks
    if: ${{ inputs.dry_run != true && needs.list-ready-tasks.outputs.has_tasks == 'true' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run standard predeploy checks
        run: npm run predeploy

      - name: Run UI tests
        env:
          ASTRID_UITEST_COOKIE: ${{ secrets.ASTRID_UITEST_COOKIE }}
        run: npm run test:ui

      - name: Checkout Astrid task tooling
        uses: actions/checkout@v4
        with:
          repository: Graceful-Tools/astrid-web
          # Keep this identical to the queue checkout above.
          ref: defc3599a3063db67e10d7d4dd600dab0ffbf76d
          path: astrid-web
          persist-credentials: false

      - name: Install Astrid task-tool dependencies
        working-directory: astrid-web
        run: npm ci

      - name: Trigger Astrid coding agent for each ready task
        env:
          ASTRID_MCP_TOKEN: ${{ secrets.ASTRID_MCP_TOKEN }}
          ASTRID_OAUTH_CLIENT_ID: ${{ secrets.ASTRID_OAUTH_CLIENT_ID }}
          ASTRID_OAUTH_CLIENT_SECRET: ${{ secrets.ASTRID_OAUTH_CLIENT_SECRET }}
          ASTRID_OAUTH_LIST_ID: a623f322-4c3c-49b5-8a94-d2d9f00c82ba
          ASTRID_WEBHOOK_URL: ${{ secrets.ASTRID_WEBHOOK_URL || 'https://astrid.cc' }}
          ASTRID_FIXALL_HARNESS: ${{ inputs.harness || 'github-copilot' }}
          ASTRID_FIXALL_TASK_IDS: ${{ needs.list-ready-tasks.outputs.task_ids }}
        run: |
          HARNESS="${ASTRID_FIXALL_HARNESS}"
          TASK_COUNT="${{ needs.list-ready-tasks.outputs.task_count }}"
          echo "Working ready iOS tasks for harness: ${HARNESS}"
          echo "Task count: ${TASK_COUNT}"

          case "${HARNESS}" in
            github-copilot) AGENT_EMAIL="copilot@astrid.cc" ;;
            claude-code) AGENT_EMAIL="claude@astrid.cc" ;;
            codex) AGENT_EMAIL="codex@astrid.cc" ;;
            astrid-server) AGENT_EMAIL="astrid@astrid.cc" ;;
            *)
              echo "Unsupported harness: ${HARNESS}" >&2
              exit 1
              ;;
          esac

          IFS=',' read -ra TASK_IDS <<< "${ASTRID_FIXALL_TASK_IDS}"
          for TASK_ID in "${TASK_IDS[@]}"; do
            (
              cd astrid-web
              npx tsx scripts/assign-task.ts "${TASK_ID}" "${AGENT_EMAIL}"
            )

            echo "Triggering coding agent for task ${TASK_ID}"
            PAYLOAD=$(node -e '
              const [taskId, repository, ref, sha, actor, workflow, runId, runNumber] = process.argv.slice(1)
              process.stdout.write(JSON.stringify({
                taskId,
                githubContext: { repository, ref, sha, actor, workflow, runId, runNumber }
              }))
            ' \
              "${TASK_ID}" \
              "${{ github.repository }}" \
              "${{ github.ref }}" \
              "${{ github.sha }}" \
              "${{ github.actor }}" \
              "${{ github.workflow }}" \
              "${{ github.run_id }}" \
              "${{ github.run_number }}")

            curl --fail-with-body --silent --show-error \
              -X POST "${ASTRID_WEBHOOK_URL}/api/coding-agent/github-trigger" \
              -H "Content-Type: application/json" \
              --oauth2-bearer "${ASTRID_MCP_TOKEN}" \
              --data "${PAYLOAD}"
            echo ""
          done

          {
            echo "## Fix All Summary (iOS)"
            echo "- Harness: \`${HARNESS}\`"
            echo "- Tasks triggered: ${TASK_COUNT}"
            echo "- Local predeploy gate: passed"
            echo ""
            echo "> Each task is handed to the Astrid coding agent. Merge and deploy separately."
          } >> "${GITHUB_STEP_SUMMARY}"

  no-tasks:
    name: 'Nothing to do'
    runs-on: [self-hosted, astrid-ios]
    needs: list-ready-tasks
    if: ${{ needs.list-ready-tasks.outputs.has_tasks == 'false' }}
    steps:
      - name: No ready tasks
        run: |
          echo "✅ No ready iOS tasks for ${{ inputs.harness || 'github-copilot' }}"
          echo "Ready list is empty — nothing to do."
