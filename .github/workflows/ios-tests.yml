name: 'iOS Tests'

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      include_ui_tests:
        description: 'Include UI tests (requires simulator or connected device)'
        required: false
        default: false
        type: boolean
      runner:
        description: 'Runner to use'
        required: false
        default: 'astrid-ios'
        type: choice
        options:
          - astrid-ios
          - macos-latest

# A new commit supersedes an older run for the same branch. Without this, one
# physical runner drains obsolete unit/UI/build jobs before reaching current code.
concurrency:
  group: ios-tests-${{ github.ref }}
  cancel-in-progress: true

# The dedicated iOS runner is the default. It queues while offline; there is no
# automatic failover. Use a manual dispatch with macos-latest for the hosted backup.

jobs:
  unit-tests:
    name: 'Unit Tests'
    runs-on: ${{ fromJSON(inputs.runner == 'macos-latest' && '["macos-latest"]' || '["self-hosted","astrid-ios"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare reusable simulator
        run: npm run simulator:prepare

      - name: Run unit tests
        run: npm test -- --destination "${DESTINATION}"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            test-results/
            *.xcresult
          retention-days: 14

  ui-tests:
    name: 'UI Tests (Simulator / Device)'
    runs-on: ${{ fromJSON(inputs.runner == 'macos-latest' && '["macos-latest"]' || '["self-hosted","astrid-ios"]') }}
    # Authenticated UI tests cannot safely run for forks because Actions withholds secrets.
    if: >
      (
        github.event_name == 'push' ||
        (github.event_name == 'pull_request' && github.base_ref == 'main') ||
        (github.event_name == 'workflow_dispatch' && inputs.include_ui_tests == true)
      ) &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Checkout Astrid UI test helper
        uses: actions/checkout@v4
        with:
          repository: Graceful-Tools/astrid-web
          # A tag astrid-web moves when the UI-test seeder's shape changes (AITD-527), not a
          # bare sha that silently drifts from what run-tests.sh expects.
          ref: uitest-run-accounts-v1
          path: astrid-web
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            astrid-web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Astrid UI test helper dependencies
        working-directory: astrid-web
        run: npm ci

      - name: Ensure Xcode tools on PATH
        run: |
          XCODE_PATH=$(xcode-select -p 2>/dev/null || echo "/Applications/Xcode.app/Contents/Developer")
          echo "${XCODE_PATH}/usr/bin" >> "${GITHUB_PATH}"
          echo "DEVELOPER_DIR=${XCODE_PATH}" >> "${GITHUB_ENV}"

      - name: Prepare reusable simulator
        run: npm run simulator:prepare

      - name: Run UI tests
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
        run: |
          set -euo pipefail
          # run-tests.sh mints an account of this run's own (gha-<run>-<attempt>), masks its
          # cookie, and deletes the account when it exits (AITD-527). The shared account it
          # replaces was wiped by every other runner's mint.
          ASTRID_WEB_DIR="${GITHUB_WORKSPACE}/astrid-web" npm run test:ui -- --destination "${DESTINATION}"
        timeout-minutes: 30

      - name: Upload UI test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: |
            test-results/
            *.xcresult
          retention-days: 14

      # A red UI job on main reached nobody: 23 runs in a row from 2026-10-15 until an audit
      # opened Actions (AITD-524). Say it in the iOS list chat, where /fixall reports, naming the
      # run and what failed. No @-mention: this can fire at any hour.
      - name: Tell the board the UI job is red
        if: failure() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        working-directory: astrid-web
        env:
          ASTRID_OAUTH_CLIENT_ID: ${{ secrets.ASTRID_OAUTH_CLIENT_ID }}
          ASTRID_OAUTH_CLIENT_SECRET: ${{ secrets.ASTRID_OAUTH_CLIENT_SECRET }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          failures="$(head -5 ../test-results/ui-failures.txt 2>/dev/null | sed 's/^/- /' || true)"
          [ -n "${failures}" ] || failures="- no test failure recorded: the job died before or outside the tests (setup, cookie mint, timeout)"
          printf '## iOS UI tests are red on main\n\nCommit `%s` — [run %s](%s)\n\n%s\n' \
            "${GITHUB_SHA::7}" "${GITHUB_RUN_ID}" "${RUN_URL}" "${failures}" \
            | npx tsx scripts/post-list-message.ts aa41c1a3-bd63-4c6d-9b87-42c6e0aafa36 -

  mac-tests:
    name: 'Mac Tests'
    runs-on: ${{ fromJSON(inputs.runner == 'macos-latest' && '["macos-latest"]' || '["self-hosted","astrid-ios"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure Xcode tools on PATH
        run: |
          XCODE_PATH=$(xcode-select -p 2>/dev/null || echo "/Applications/Xcode.app/Contents/Developer")
          echo "${XCODE_PATH}/usr/bin" >> "${GITHUB_PATH}"
          echo "DEVELOPER_DIR=${XCODE_PATH}" >> "${GITHUB_ENV}"

      - name: Run Mac tests
        run: npm run test:mac
        timeout-minutes: 30

  build-check:
    name: 'Build Check'
    runs-on: ${{ fromJSON(inputs.runner == 'macos-latest' && '["macos-latest"]' || '["self-hosted","astrid-ios"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (simulator)
        run: npm run build
        timeout-minutes: 20
