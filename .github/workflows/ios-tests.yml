name: 'iOS Tests'

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      include_ui_tests:
        description: 'Include UI tests (slower, requires simulator)'
        required: false
        default: false
        type: boolean

jobs:
  unit-tests:
    name: 'Unit Tests'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            test-results/
            *.xcresult
          retention-days: 14

  ui-tests:
    name: 'UI Tests (Simulator)'
    runs-on: macos-latest
    # Run on PRs to main, manual dispatch with ui flag, or push to main
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.include_ui_tests == true)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Boot simulator
        run: |
          UDID=$(xcrun simctl list devices available | grep "iPhone 17 " | head -1 | grep -o '[A-F0-9-]\{36\}')
          if [ -z "${UDID}" ]; then
            # Fall back to iPhone 16 if 17 not available
            UDID=$(xcrun simctl list devices available | grep "iPhone 16 " | head -1 | grep -o '[A-F0-9-]\{36\}')
          fi
          echo "Booting simulator: ${UDID}"
          xcrun simctl boot "${UDID}" || true
          xcrun simctl bootstatus "${UDID}" -b

      - name: Run UI tests
        run: npm run test:ui
        timeout-minutes: 30

      - name: Upload UI test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: |
            test-results/
            *.xcresult
          retention-days: 14

  build-check:
    name: 'Build Check'
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (simulator)
        run: npm run build
        timeout-minutes: 20
