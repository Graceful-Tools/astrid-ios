name: 'iOS Tests'

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      include_ui_tests:
        description: 'Include UI tests (requires simulator or connected device)'
        required: false
        default: false
        type: boolean
      runner:
        description: 'Runner to use'
        required: false
        default: 'astrid-ios'
        type: choice
        options:
          - astrid-ios
          - macos-latest

# The dedicated iOS runner is the default. It queues while offline; there is no
# automatic failover. Use a manual dispatch with macos-latest for the hosted backup.

jobs:
  unit-tests:
    name: 'Unit Tests'
    runs-on: ${{ fromJSON(inputs.runner == 'macos-latest' && '["macos-latest"]' || '["self-hosted","astrid-ios"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            test-results/
            *.xcresult
          retention-days: 14

  ui-tests:
    name: 'UI Tests (Simulator / Device)'
    runs-on: ${{ fromJSON(inputs.runner == 'macos-latest' && '["macos-latest"]' || '["self-hosted","astrid-ios"]') }}
    # Authenticated UI tests cannot safely run for forks because Actions withholds secrets.
    if: >
      (
        github.event_name == 'push' ||
        (github.event_name == 'pull_request' && github.base_ref == 'main') ||
        (github.event_name == 'workflow_dispatch' && inputs.include_ui_tests == true)
      ) &&
      (
        github.event_name != 'pull_request' ||
        github.event.pull_request.head.repo.full_name == github.repository
      )
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Ensure Xcode tools on PATH
        run: |
          XCODE_PATH=$(xcode-select -p 2>/dev/null || echo "/Applications/Xcode.app/Contents/Developer")
          echo "${XCODE_PATH}/usr/bin" >> "${GITHUB_PATH}"
          echo "DEVELOPER_DIR=${XCODE_PATH}" >> "${GITHUB_ENV}"

      - name: Boot simulator (if no real device attached)
        run: |
          # Check for a connected real device first
          REAL_DEVICE=$(xcrun xctrace list devices 2>/dev/null | grep -v Simulator | grep iPhone | head -1 || true)
          if [ -n "${REAL_DEVICE}" ]; then
            echo "✅ Real device found: ${REAL_DEVICE}"
            echo "DESTINATION=platform=iOS,name=$(echo ${REAL_DEVICE} | sed 's/ (.*)//')" >> "${GITHUB_ENV}"
          else
            echo "No real device — using simulator"
            UDID=$(xcrun simctl list devices available | grep "iPhone 17 " | head -1 | grep -oE '[A-F0-9-]{36}' || true)
            if [ -z "${UDID}" ]; then
              UDID=$(xcrun simctl list devices available | grep "iPhone 16 " | head -1 | grep -oE '[A-F0-9-]{36}' || true)
            fi
            echo "Booting simulator: ${UDID}"
            xcrun simctl boot "${UDID}" 2>/dev/null || true
            xcrun simctl bootstatus "${UDID}" -b
            echo "DESTINATION=platform=iOS Simulator,name=iPhone 17" >> "${GITHUB_ENV}"
          fi

      - name: Run UI tests
        env:
          ASTRID_UITEST_COOKIE: ${{ secrets.ASTRID_UITEST_COOKIE }}
        run: npm run test:ui
        timeout-minutes: 30

      - name: Upload UI test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: |
            test-results/
            *.xcresult
          retention-days: 14

  build-check:
    name: 'Build Check'
    runs-on: ${{ fromJSON(inputs.runner == 'macos-latest' && '["macos-latest"]' || '["self-hosted","astrid-ios"]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (simulator)
        run: npm run build
        timeout-minutes: 20
