name: 'iOS Tests'

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      include_ui_tests:
        description: 'Include UI tests (requires simulator or connected device)'
        required: false
        default: false
        type: boolean
      runner:
        description: 'Runner to use'
        required: false
        default: 'self-hosted'
        type: choice
        options:
          - self-hosted
          - macos-latest

# Self-hosted Mac is preferred: faster builds, no simulator spin-up delay,
# can target a real connected device. Falls back to macos-latest if the
# runner is offline (set runner input to macos-latest manually).
env:
  RUNNER: ${{ inputs.runner || 'self-hosted' }}

jobs:
  unit-tests:
    name: 'Unit Tests'
    # Uses self-hosted Mac runner by default; fall back via manual dispatch
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            test-results/
            *.xcresult
          retention-days: 14

  ui-tests:
    name: 'UI Tests (Simulator / Device)'
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    if: >
      github.event_name == 'push' ||
      (github.event_name == 'pull_request' && github.base_ref == 'main') ||
      (github.event_name == 'workflow_dispatch' && inputs.include_ui_tests == true)
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Select Xcode version
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Boot simulator (if no real device attached)
        run: |
          # Check for a connected real device first
          REAL_DEVICE=$(xcrun xctrace list devices 2>/dev/null | grep -v Simulator | grep iPhone | head -1 || true)
          if [ -n "${REAL_DEVICE}" ]; then
            echo "✅ Real device found: ${REAL_DEVICE}"
            echo "DESTINATION=platform=iOS,name=$(echo ${REAL_DEVICE} | sed 's/ (.*)//')" >> "${GITHUB_ENV}"
          else
            echo "No real device — using simulator"
            UDID=$(xcrun simctl list devices available | grep "iPhone 17 " | head -1 | grep -oE '[A-F0-9-]{36}' || true)
            if [ -z "${UDID}" ]; then
              UDID=$(xcrun simctl list devices available | grep "iPhone 16 " | head -1 | grep -oE '[A-F0-9-]{36}' || true)
            fi
            echo "Booting simulator: ${UDID}"
            xcrun simctl boot "${UDID}" 2>/dev/null || true
            xcrun simctl bootstatus "${UDID}" -b
            echo "DESTINATION=platform=iOS Simulator,name=iPhone 17" >> "${GITHUB_ENV}"
          fi

      - name: Run UI tests
        run: npm run test:ui
        timeout-minutes: 30

      - name: Upload UI test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-test-results
          path: |
            test-results/
            *.xcresult
          retention-days: 14

  build-check:
    name: 'Build Check'
    runs-on: ${{ inputs.runner || 'self-hosted' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (simulator)
        run: npm run build
        timeout-minutes: 20
